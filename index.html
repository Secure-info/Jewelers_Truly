<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewelers Truly</title>

    <link rel="icon" type="image/png" href="Just logo.svg">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000060;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: calc(100% - 16px);
            max-width: 600px;
            margin: 8px auto;
            padding: 22px 14px 18px;
            background: #fffbe6;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
            overflow: hidden;
            animation: pageFade 0.9s ease forwards;
        }

        @keyframes pageFade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container canvas {
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 3;
        }

        .logo {
            width: 120px;
            max-width: 35%;
            height: auto;
            margin-bottom: 4px;
            animation: logoDrop 0.8s ease forwards;
            transition:
                transform 0.35s ease,
                opacity 0.35s ease;
        }

        .logo:hover {
            transform: scale(1.06);
            opacity: 0.9;
        }

        @keyframes logoDrop {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }

            70% {
                transform: translateY(3px) scale(1.02);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .business-name {
            font-size: clamp(30px, 7vw, 42px);
            line-height: 1.1;
            font-weight: 700;
            color: #000060;
            margin: 5px 0 14px;
            animation: titleReveal 0.9s ease forwards;
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(14px);
                letter-spacing: 4px;
            }

            to {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: normal;
            }
        }

        .description {
            font-size: clamp(16px, 4vw, 19px);
            line-height: 1.45;
            margin: 5px 0;
            opacity: 0;
            animation: textFade 0.7s ease forwards;
        }

        .description:nth-of-type(2) {
            animation-delay: 0.15s;
        }

        .description:nth-of-type(3) {
            animation-delay: 0.30s;
        }

        .description:nth-of-type(4) {
            animation-delay: 0.45s;
        }

        @keyframes textFade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-heading {
            font-size: clamp(17px, 4vw, 20px);
            font-weight: 600;
            margin: 15px 0 9px;
        }

        .contact-info {
            font-size: clamp(17px, 4.2vw, 21px);
            line-height: 1.4;
            color: #000060;
            margin: 8px 0;
        }

        .contact-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 8px 0;
            font-size: clamp(17px, 4.2vw, 21px);
        }

        .icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            vertical-align: middle;
            flex-shrink: 0;
        }

        a {
            color: #000060;
            text-decoration: none;
            transition:
                color 0.25s ease,
                transform 0.25s ease;
        }

        a:hover {
            color: #ff6600;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .hover-effect {
            cursor: pointer;
        }

        .hover-effect:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .social-icons {
            margin: 18px 0 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }

        .social-icons a:hover {
            transform: translateY(-4px) scale(1.08);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.12);
        }

        .social-icons img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .shine-line {
            width: 65%;
            height: 1px;
            margin: 14px auto;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 0, 96, 0.25),
                transparent
            );
            position: relative;
            overflow: hidden;
        }

        .shine-line::after {
            content: "";
            position: absolute;
            top: 0;
            left: -40%;
            width: 30%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            animation: lineShine 3s linear infinite;
        }

        @keyframes lineShine {
            from {
                left: -40%;
            }

            to {
                left: 110%;
            }
        }

        @media screen and (max-width: 480px) {
            .container {
                width: calc(100% - 10px);
                margin: 5px;
                padding: 18px 10px 15px;
            }

            .logo {
                width: 100px;
            }

            .business-name {
                font-size: 34px;
            }

            .description {
                font-size: 17px;
            }

            .contact-info,
            .contact-row {
                font-size: 18px;
            }

            .icon {
                width: 20px;
                height: 20px;
            }

            .social-icons {
                gap: 10px;
            }

            .social-icons a {
                width: 40px;
                height: 40px;
            }

            .social-icons img {
                width: 28px;
                height: 28px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <canvas
        style="width: 352px; height: 292px; position: absolute; z-index: 2; left: 0px; top: 0px;"
        width="704"
        height="584">
    </canvas>

    <div class="content">

        <img
            src="https://secure-info.github.io/Moshe/Logo-7-8-24-TransparentJT.png"
            alt="Jewelers Truly Logo"
            class="logo"
        >

        <p class="business-name">
            Jewelers Truly
        </p>

        <div class="shine-line"></div>

        <p class="description">
            At Jewelers Truly, we manufacture and custom make:
        </p>

        <p class="description">
            Engagement Rings, Eternity Bands, Tennis Bracelets,
            Necklaces &amp; Pendants
        </p>

        <p class="description">
            We carry both natural &amp; lab-grown diamonds.
        </p>

        <p class="contact-heading">
            Contact us for more info
        </p>

        <div class="contact-links">

            <div class="contact-row">

                <a
                    href="https://api.whatsapp.com/send/?phone=16464641935&text&type=phone_number&app_absent=0"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="contact-link hover-effect"
                    aria-label="Message Jewelers Truly on WhatsApp"
                >
                    <img
                        src="https://secure-info.github.io/Moshe/logowhatsapp.png"
                        alt="WhatsApp"
                        class="icon"
                    >
                </a>

                <a
                    href="tel:+16464641935"
                    class="hover-effect"
                >
                    +1 (646) 464-1935
                </a>

            </div>

            <p class="contact-info">
                <a
                    href="mailto:info@JewelersTruly.com"
                    class="contact-link hover-effect"
                >
                    <img
                        src="https://secure-info.github.io/Moshe/logoemail.png"
                        alt="Email"
                        class="icon"
                    >

                    <span>
                        info@JewelersTruly.com
                    </span>
                </a>
            </p>

            <div class="social-icons">

                <a
                    href="https://www.google.com/maps/place/Jewelers+Truly/@40.7574377,-73.9836783,703m/data=!3m2!1e3!4b1!4m6!3m5!1s0x89c258ff099c6aa9:0x6a7f56af9d62e636!8m2!3d40.7574377!4d-73.9811034!16s%2Fg%2F11y4036tsm?entry=ttu&g_ep=EgoyMDI2MDkzMC4wIKXMDSoASAFQAw%3D%3D"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Jewelers Truly on Google Maps"
                    title="Google Maps"
                >
                    <img
                        src="https://secure-info.github.io/Moshe/logoaddress.png"
                        alt="Google Maps"
                    >
                </a>

                <a
                    href="https://www.linkedin.com/company/jewelers-truy/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="LinkedIn"
                    title="LinkedIn"
                >
                    <img
                        src="https://secure-info.github.io/Moshe/logolinkedin.png"
                        alt="LinkedIn"
                    >
                </a>

                <a
                    href="https://www.instagram.com/jewelers_truly/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                    title="Instagram"
                >
                    <img
                        src="https://secure-info.github.io/Moshe/logoinsta.png"
                        alt="Instagram"
                    >
                </a>

                <a
                    href="https://www.tiktok.com/@jewelers_truly?_t=8n0ifSYprnb&_r=1"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="TikTok"
                    title="TikTok"
                >
                    <img
                        src="https://secure-info.github.io/Moshe/logotiktak.png"
                        alt="TikTok"
                    >
                </a>

            </div>

            <div>
                <script
                    type="text/javascript"
                    src="https://4cs.gia.edu/interactive-4cs/js/embed.js"
                    charset="UTF-8">
                </script>
            </div>

        </div>

    </div>

</div>

<script>
    /*
        Get the exact canvas above
    */
    const canvas = document.querySelector('.container canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];

    const particleCount = 30;

    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    function createParticle() {
        return {
            x: random(0, 352),
            y: random(0, 292),
            size: random(1, 3.5),
            speedX: random(-0.08, 0.08),
            speedY: random(-0.18, -0.04),
            alpha: random(0.2, 0.85),
            pulseSpeed: random(0.01, 0.035),
            direction: 1,
            rotation: random(0, Math.PI * 2)
        };
    }

    function buildParticles() {
        particles = [];

        for (let i = 0; i < particleCount; i++) {
            particles.push(createParticle());
        }
    }

    function drawSparkle(particle) {
        ctx.save();

        /*
            Canvas internal resolution is 704x584,
            while CSS size is 352x292.
            Scale by 2 for sharp rendering.
        */
        ctx.translate(
            particle.x * 2,
            particle.y * 2
        );

        ctx.rotate(particle.rotation);

        ctx.globalAlpha = particle.alpha;

        const size = particle.size * 2;

        ctx.beginPath();

        ctx.moveTo(0, -size * 2);
        ctx.lineTo(size * 0.45, -size * 0.45);

        ctx.lineTo(size * 2, 0);
        ctx.lineTo(size * 0.45, size * 0.45);

        ctx.lineTo(0, size * 2);
        ctx.lineTo(-size * 0.45, size * 0.45);

        ctx.lineTo(-size * 2, 0);
        ctx.lineTo(-size * 0.45, -size * 0.45);

        ctx.closePath();

        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#ffffff';

        ctx.fill();

        ctx.restore();
    }

    function animateCanvas() {
        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        particles.forEach(particle => {

            particle.x += particle.speedX;
            particle.y += particle.speedY;

            particle.rotation += 0.002;

            particle.alpha +=
                particle.pulseSpeed *
                particle.direction;

            if (particle.alpha >= 0.9) {
                particle.direction = -1;
            }

            if (particle.alpha <= 0.15) {
                particle.direction = 1;
            }

            if (
                particle.y < -10 ||
                particle.x < -10 ||
                particle.x > 362
            ) {
                particle.x = random(0, 352);
                particle.y = 302;
            }

            drawSparkle(particle);
        });

        requestAnimationFrame(animateCanvas);
    }

    buildParticles();
    animateCanvas();


    /*
        Click animation
    */
    document
        .querySelectorAll('.hover-effect, .social-icons a')
        .forEach(item => {

            item.addEventListener('click', () => {

                item.animate(
                    [
                        {
                            transform: 'scale(1)'
                        },
                        {
                            transform: 'scale(0.92)'
                        },
                        {
                            transform: 'scale(1.06)'
                        },
                        {
                            transform: 'scale(1)'
                        }
                    ],
                    {
                        duration: 300,
                        easing: 'ease-out'
                    }
                );

            });

        });


    /*
        Subtle logo movement on desktop
    */
    const container = document.querySelector('.container');
    const logo = document.querySelector('.logo');

    container.addEventListener('mousemove', event => {

        if (window.innerWidth < 768) {
            return;
        }

        const rect =
            container.getBoundingClientRect();

        const x =
            (
                event.clientX -
                rect.left -
                rect.width / 2
            ) / rect.width;

        const y =
            (
                event.clientY -
                rect.top -
                rect.height / 2
            ) / rect.height;

        logo.style.transform =
            `translate(${x * 6}px, ${y * 4}px) scale(1.02)`;

    });

    container.addEventListener('mouseleave', () => {
        logo.style.transform = '';
    });


    /*
        Social icon entrance animation
    */
    const socialLinks =
        document.querySelectorAll('.social-icons a');

    socialLinks.forEach((link, index) => {

        link.style.opacity = '0';
        link.style.transform = 'translateY(10px)';

        setTimeout(() => {

            link.style.transition =
                'opacity 0.5s ease, transform 0.5s ease';

            link.style.opacity = '1';
            link.style.transform = 'translateY(0)';

        }, 650 + index * 120);

    });
</script>

</body>
</html>
