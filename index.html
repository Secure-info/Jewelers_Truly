<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewelers Truly</title>

    <link rel="icon" type="image/png" href="Just logo.svg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000060;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: calc(100% - 16px);
            max-width: 600px;
            margin: 8px auto;
            padding: 18px 14px;
            background-color: #fffbe6;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .logo {
            width: 120px;
            max-width: 35%;
            height: auto;
            margin-bottom: 4px;
            animation: bounce 0.5s ease forwards;
            transition: transform 0.3s, opacity 0.3s;
        }

        .logo:hover {
            transform: scale(1.05);
            opacity: 0.85;
        }

        @keyframes bounce {
            0% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .business-name {
            font-size: clamp(30px, 7vw, 42px);
            line-height: 1.1;
            font-weight: 700;
            color: #000060;
            margin: 5px 0 14px;
        }

        .description {
            font-size: clamp(16px, 4vw, 19px);
            line-height: 1.4;
            margin: 5px 0;
        }

        .contact-heading {
            font-size: clamp(17px, 4vw, 20px);
            font-weight: 600;
            margin: 14px 0 8px;
        }

        .contact-info {
            font-size: clamp(17px, 4.2vw, 21px);
            line-height: 1.4;
            color: #000060;
            margin: 8px 0;
        }

        .contact-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 8px 0;
            font-size: clamp(17px, 4.2vw, 21px);
        }

        .icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            vertical-align: middle;
            flex-shrink: 0;
        }

        a {
            color: #000060;
            text-decoration: none;
            transition: color 0.3s, transform 0.3s;
        }

        a:hover {
            color: #ff6600;
            text-decoration: underline;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .social-icons {
            margin: 18px 0 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .social-icons img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .social-icons img:hover {
            transform: scale(1.12);
        }

        .hover-effect {
            transition: transform 0.3s, color 0.3s;
            cursor: pointer;
        }

        .hover-effect:hover {
            transform: scale(1.03);
        }

        @media screen and (max-width: 480px) {
            .container {
                width: calc(100% - 10px);
                margin: 5px;
                padding: 15px 10px;
            }

            .logo {
                width: 100px;
            }

            .business-name {
                font-size: 34px;
            }

            .description {
                font-size: 17px;
            }

            .contact-info,
            .contact-row {
                font-size: 18px;
            }

            .icon {
                width: 20px;
                height: 20px;
            }

            .social-icons img {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="https://secure-info.github.io/Moshe/Logo-7-8-24-TransparentJT.png"
        alt="Jewelers Truly Logo"
        class="logo"
    >

    <p class="business-name">Jewelers Truly</p>

    <p class="description">
        At Jewelers Truly, we manufacture and custom make:
    </p>

    <p class="description">
        Engagement Rings, Eternity Bands, Tennis Bracelets,
        Necklaces &amp; Pendants
    </p>

    <p class="description">
        We carry both natural &amp; lab-grown diamonds.
    </p>

    <p class="contact-heading">
        Contact us for more info
    </p>

    <div class="contact-links">

        <!-- WhatsApp + Phone -->
        <div class="contact-row">

            <a
                href="https://api.whatsapp.com/send/?phone=16464641935&text&type=phone_number&app_absent=0"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-link hover-effect"
                aria-label="Message Jewelers Truly on WhatsApp"
            >
                <img
                    src="https://secure-info.github.io/Moshe/logowhatsapp.png"
                    alt="WhatsApp"
                    class="icon"
                >
            </a>

            <a
                href="tel:+16464641935"
                class="hover-effect"
            >
                +1 (646) 464-1935
            </a>

        </div>

        <!-- Email -->
        <p class="contact-info">

            <a
                href="mailto:info@JewelersTruly.com"
                class="contact-link hover-effect"
            >
                <img
                    src="https://secure-info.github.io/Moshe/logoemail.png"
                    alt="Email"
                    class="icon"
                >

                <span>info@JewelersTruly.com</span>
            </a>

        </p>

        <!-- Google Maps + Social Media -->
        <div class="social-icons">

            <!-- Google Maps -->
            <a
                href="https://www.google.com/maps/place/Jewelers+Truly/@40.7574377,-73.9836783,703m/data=!3m2!1e3!4b1!4m6!3m5!1s0x89c258ff099c6aa9:0x6a7f56af9d62e636!8m2!3d40.7574377!4d-73.9811034!16s%2Fg%2F11y4036tsm?entry=ttu&g_ep=EgoyMDI2MDkzMC4wIKXMDSoASAFQAw%3D%3D"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Jewelers Truly on Google Maps"
            >
                <img
                    src="https://secure-info.github.io/Moshe/logoaddress.png"
                    alt="Google Maps"
                >
            </a>

            <!-- LinkedIn -->
            <a
                href="https://www.linkedin.com/company/jewelers-truy/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
            >
                <img
                    src="https://secure-info.github.io/Moshe/logolinkedin.png"
                    alt="LinkedIn"
                >
            </a>

            <!-- Instagram -->
            <a
                href="https://www.instagram.com/jewelers_truly/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >
                <img
                    src="https://secure-info.github.io/Moshe/logoinsta.png"
                    alt="Instagram"
                >
            </a>

            <!-- TikTok -->
            <a
                href="https://www.tiktok.com/@jewelers_truly?_t=8n0ifSYprnb&_r=1"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="TikTok"
            >
                <img
                    src="https://secure-info.github.io/Moshe/logotiktak.png"
                    alt="TikTok"
                >
            </a>

        </div>

        <!-- GIA 4Cs -->
        <div>
            <script
                type="text/javascript"
                src="https://4cs.gia.edu/interactive-4cs/js/embed.js"
                charset="UTF-8">
            </script>
        </div>

    </div>
</div>

<script>
    document.querySelectorAll('.hover-effect').forEach(item => {
        item.addEventListener('click', () => {
            item.style.transform = 'scale(1.05)';

            setTimeout(() => {
                item.style.transform = '';
            }, 200);
        });
    });
</script>

</body>
</html>
